<svg width="2588" height="800" viewBox="0 0 2588 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    <![CDATA[
      :root { --loader-color: #FEB801; }

      .loader-icon,
      .loader-icon-secondary {
        fill: none;
        stroke: var(--loader-color);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 2600;
        stroke-dashoffset: 2600;
        animation: draw-loop 3.8s cubic-bezier(.65, 0, .35, 1) infinite;
      }

      .loader-icon-secondary {
        animation-delay: .18s;
      }

      .loader-wordmark {
        fill: var(--loader-color);
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: wordmark-loop 3.8s cubic-bezier(.22, 1, .36, 1) infinite;
      }

      @keyframes draw-loop {
        0%, 35%   { opacity: 0; stroke-dashoffset: 2600; }
        39%       { opacity: 1; stroke-dashoffset: 2600; }
        62%, 78%  { opacity: 1; stroke-dashoffset: 0; }
        88%, 100% { opacity: 0; stroke-dashoffset: 2600; }
      }

      @keyframes wordmark-loop {
        0%, 47%  { opacity: 0; transform: translateX(24px); }
        56%, 78% { opacity: 1; transform: translateX(0); }
        88%, 100% { opacity: 0; transform: translateX(-8px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-icon,
        .loader-icon-secondary,
        .loader-wordmark {
          animation: none;
          opacity: 1;
          stroke-dashoffset: 0;
          transform: none;
        }

      }
    ]]>
  </style>

  <g class="loader-icon">
    <rect x="19.5122" y="28.2168" width="273.171" height="741.463" rx="136.585" stroke-width="39.0244"/>
  </g>

