name: BookTKIT E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Approved BookTKIT test suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - contracts
          - mobile
          - auth
          - signup
          - login
          - organizer
          - event-creation
          - checkout
          - api
          - security
          - razorpay
          - scanner
          - diagnostics
          - all
      base_url:
        description: Target URL. Production is always read-only.
        required: true
        default: https://www.booktkit.com
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/booktkit-devtools
    env:
      BOOKTKIT_BASE_URL: ${{ inputs.base_url }}
      BOOKTKIT_ALLOW_MUTATIONS: "false"
      BOOKTKIT_RAZORPAY_TEST_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate target
        shell: bash
        run: |
          node -e "const u=new URL(process.env.BOOKTKIT_BASE_URL); if(!['https:'].includes(u.protocol)) process.exit(2); const allowed=['booktkit.com','www.booktkit.com']; if(!allowed.includes(u.hostname) && !u.hostname.endsWith('.booktkit.com')) process.exit(3)"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run selected suite
        run: node src/cli.js "${{ inputs.suite }}"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booktkit-e2e-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            tools/booktkit-devtools/artifacts/
            tools/booktkit-devtools/test-summary.json
          if-no-files-found: ignore
          retention-days: 14
