name: BookTKIT DevTools

on:
  pull_request:
    paths:
      - 'tools/booktkit-devtools/**'
      - '.github/workflows/booktkit-devtools.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/booktkit-devtools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/booktkit-devtools/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          BOOKTKIT_BASE_URL: https://www.booktkit.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booktkit-playwright-report
          path: tools/booktkit-devtools/artifacts/
          if-no-files-found: ignore
