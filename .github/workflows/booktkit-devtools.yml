name: BookTKIT DevTools
on:
  push:
    branches: [main]
    paths: ['source/website/**', 'tools/booktkit-devtools/**', '.github/workflows/booktkit-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: booktkit-production-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/booktkit-devtools
    env:
      BOOKTKIT_BASE_URL: https://booktkit.com
      BOOKTKIT_ALLOW_MUTATIONS: 'false'
      BOOKTKIT_RUN_TIMEOUT_MINUTES: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/booktkit-devtools/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node src/cli.js smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-${{ github.run_id }}
          path: tools/booktkit-devtools/test-summary.json
          retention-days: 3
